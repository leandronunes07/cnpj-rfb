services:
  cnpj-etl:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cnpj-etl-engine
    restart: always
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    environment:
      - DB_DRIVER=${DB_DRIVER:-mysql}
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:?defina DB_PASSWORD no .env ou nas variáveis de ambiente do host}
      - DB_NAME=${DB_NAME:-cnpjrbf-go}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - API_PORT=${API_PORT:-8080}
      - API_TOKEN=${API_TOKEN:?defina API_TOKEN no .env ou nas variáveis de ambiente do host}
      - DOWNLOAD_WORKERS=${DOWNLOAD_WORKERS:-4}
      - BATCH_SIZE=${BATCH_SIZE:-10000}
      - AUTO_CLEANUP=${AUTO_CLEANUP:-true}
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 3 * * *}
      - RUN_ONCE=${RUN_ONCE:-false}
      # Redis e Meilisearch são opcionais — vazio = desativado, sem afetar o
      # resto da aplicação. Veja a seção "extras" abaixo para subi-los junto.
      - REDIS_ADDR=${REDIS_ADDR:-}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=${REDIS_DB:-0}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-120}
      - MEILISEARCH_HOST=${MEILISEARCH_HOST:-}
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY:-}
      - MEILISEARCH_INDEX=${MEILISEARCH_INDEX:-estabelecimentos}
    volumes:
      - etl_data:/app/data

  # --- Extras opcionais ---------------------------------------------------
  # Não sobem por padrão com `docker-compose up`. Para incluir:
  #   docker-compose --profile extras up -d --build
  # E defina no seu .env: REDIS_ADDR=redis:6379 e/ou
  # MEILISEARCH_HOST=http://meilisearch:7700 (+ MEILISEARCH_API_KEY igual à
  # MEILI_MASTER_KEY abaixo), para o serviço cnpj-etl realmente usá-los.

  redis:
    image: redis:7-alpine
    container_name: cnpj-etl-redis
    restart: always
    profiles: ["extras"]
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: cnpj-etl-meilisearch
    restart: always
    profiles: ["extras"]
    environment:
      # Empty = Meilisearch runs unprotected (fine for local/dev only). Set
      # MEILISEARCH_API_KEY in your .env before exposing this beyond
      # localhost — docker-compose can't enforce that at the file level
      # without also forcing it on everyone who never touches this profile.
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-}
      - MEILI_NO_ANALYTICS=true
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  etl_data:
  redis_data:
  meili_data:
